# GTA Kalisz — gta.patrykjagielski.tech (plik trafia do http {} jako conf.d/default.conf)

# Cache: pliki z hashem w nazwie (app.<hash>.js, kalisz.<hash>.json) nigdy się nie zmieniają,
# index.html przeglądarka sprawdza przy każdym wejściu (ETag), więc nowa wersja działa od razu po wdrożeniu.
map $uri $gta_cache {
    "~^/[a-z]+\.[0-9a-f]{10}\.(js|json)$"  "public, max-age=31536000, immutable";
    default                                "no-cache";
}

server {
    listen 80 default_server;
    server_name gta.patrykjagielski.tech;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types application/javascript application/json;
    server_tokens off;

    # Cloudflare (tunel) stoi przed originem: prawdziwe IP klienta jest w nagłówku, ruch przychodzi z sieci Dockera
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # build zapisuje obok plików wersje .gz; kompresja w locie tylko jako zapas
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Nagłówki tylko na poziomie server: add_header w location wyłączyłby dziedziczenie wszystkich poniższych.
    # Pełna CSP (hashe skryptów inline) jest w <meta> w index.html; tu tylko to, czego <meta> nie potrafi.
    add_header Cache-Control $gta_cache always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # pliki ukryte i wersje robocze (.htaccess, .tmp-*) nie wychodzą na zewnątrz
    location ~ /\. {
        access_log off;
        return 404;
    }

    # gra online: WebSocket do kontenera net (server/index.mjs). Adres przez zmienną i resolver Dockera,
    # żeby nginx wstał (i przeszedł nginx -t) także wtedy, gdy kontenera net nie ma — wtedy tylko /ws zwraca 502.
    location = /ws {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gta_net http://net:8080;
        proxy_pass $gta_net;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # po real_ip: IP gracza z CF-Connecting-IP (limit połączeń na IP)
        proxy_read_timeout 90s;                    # serwer pinguje co 30 s
        proxy_send_timeout 90s;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
