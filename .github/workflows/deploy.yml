# Wdrożenie na produkcję (Mikrus, https://gta.patrykjagielski.tech).
#   push do main              ./deploy.sh; z --config, jeśli push zmienił coś w deploy/ (docker-compose, nginx)
#   Actions → Deploy → Run    ręcznie, z opcją --config
#   pull request              tylko lint i build (bez wdrożenia)
# Sekrety repozytorium: MIKRUS_HOST, MIKRUS_PORT, MIKRUS_SSH_KEY, MIKRUS_KNOWN_HOSTS (opcjonalnie MIKRUS_USER, domyślnie root)
# — jak je przygotować, opisuje README (sekcja „Wdrożenie”).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: 'Wdróż też docker-compose.yml i konfigurację nginx (--config)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://gta.patrykjagielski.tech
    concurrency:
      group: production                          # wdrożenia po kolei, nigdy dwa naraz
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                         # historia do porównania z poprzednim stanem main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Dostęp SSH do Mikrusa
        env:
          MIKRUS_HOST: ${{ secrets.MIKRUS_HOST }}
          MIKRUS_PORT: ${{ secrets.MIKRUS_PORT }}
          MIKRUS_USER: ${{ secrets.MIKRUS_USER }}
          MIKRUS_SSH_KEY: ${{ secrets.MIKRUS_SSH_KEY }}
          MIKRUS_KNOWN_HOSTS: ${{ secrets.MIKRUS_KNOWN_HOSTS }}
        run: |
          for v in MIKRUS_HOST MIKRUS_PORT MIKRUS_SSH_KEY MIKRUS_KNOWN_HOSTS; do
            eval "val=\${$v}"
            [ -n "$val" ] || { echo "::error::brak sekretu $v (Settings → Secrets and variables → Actions, opis w README)"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MIKRUS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$MIKRUS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # deploy.sh łączy się z hostem „mikrus”, tak jak z komputera autora
          cat > ~/.ssh/config <<CFG
          Host mikrus
            HostName $MIKRUS_HOST
            Port $MIKRUS_PORT
            User ${MIKRUS_USER:-root}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Czy wdrożyć też konfigurację (deploy/)
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MANUAL: ${{ inputs.config }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then config=$MANUAL
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then config=true   # nowa gałąź lub nadpisana historia
          elif git diff --quiet "$BEFORE" HEAD -- deploy/; then config=false
          else config=true
          fi
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "wdrożenie konfiguracji: $config"

      - name: Wdrożenie
        env:
          CONFIG: ${{ steps.mode.outputs.config }}
        run: |
          if [ "$CONFIG" = true ]; then ./deploy.sh --config; else ./deploy.sh; fi

      - name: Sprzątanie klucza
        if: always()
        run: rm -f ~/.ssh/deploy_key
